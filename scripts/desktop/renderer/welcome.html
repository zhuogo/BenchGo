<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
    <title>BenchGo</title>
    <link rel="stylesheet" href="benchgo-startup.css">
    <link rel="stylesheet" href="startup-progress.css">
    <script src="benchgo-startup.js" defer></script>
  </head>
  <body>
    <div class="drag-region" aria-hidden="true"></div>
    <main>
      <div class="startup-field" aria-hidden="true"></div>
      <div class="startup-brand">
        <img class="startup-mascot" src="../../../assets/brand/benchgo-mark.svg" alt="" width="72" height="72">
        <h1>BenchGo</h1>
      </div>
      <div class="startup-feedback">
        <span class="startup-engine">DeepSeek</span>
        <p id="startup-status" class="startup-status" role="status" aria-live="polite">正在打开工作台…</p>
        <div class="startup-loading" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <button id="startup-retry" type="button" hidden>重试</button>
      </div>
    </main>
  </body>
</html>
