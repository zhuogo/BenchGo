<!doctype html>
<html lang="zh-CN" class="startup-splash">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
    <title>BenchGo</title>
    <link rel="stylesheet" href="loading.css">
    <link rel="stylesheet" href="benchgo-startup.css">
    <script src="loading-status.js" defer></script>
    <script src="splash.js" defer></script>
  </head>
  <body>
    <div class="drag-region" aria-hidden="true"></div>
    <main>
      <div class="startup-field" aria-hidden="true"></div>
      <div class="startup-brand">
        <img class="startup-mascot" src="../../../assets/brand/benchgo-mark.svg" alt="" width="72" height="72">
        <h1>BenchGo</h1>
      </div>
      <div class="startup-feedback">
        <p id="startup-status" class="startup-status" role="status" aria-live="polite" aria-atomic="true">正在准备插件…</p>
        <p id="startup-wait" class="startup-wait" role="status"></p>
      </div>
    </main>
  </body>
</html>
