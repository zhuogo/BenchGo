# Opt into the official derived index; history remains in the official Session store.
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('storages/benchgo-session-search.sqlite')
    openAt: first-search

- insert:
    - id: commander
      name: 'benchgo-plugin'
    - id: commander-harness
      name: 'benchgo-plugin/harness-plugin'
    - id: commander-superagent
      name: 'benchgo-plugin/superagent-plugin'
    - id: commander-voice
      name: 'benchgo-plugin/voice-plugin'
    - id: commander-link
      name: 'benchgo-plugin/link-plugin'
