name: BenchGo plugin package
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      release_version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CI: 'true'
      DSH_TELEMETRY_DISABLED: '1'
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      RELEASE_VERSION: ${{ inputs.release_version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Stage unified identity without changing component versions
        run: node scripts/release/stage.mjs --source-sha "$SOURCE_SHA" --release-version "$RELEASE_VERSION"
      - name: Prepare package manager
        run: |
          set -euo pipefail
          npm install --global --force corepack@0.34.0
          corepack enable
          git config --global core.longpaths true
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          npm run setup
          npm ci --prefix plugins/link
          npm ci --prefix plugins/benchgo
      - name: Verify update contract and build plugin
        run: |
          set -euo pipefail
          node --test plugins/benchgo/test/update-feed.test.mjs
          npm run build:plus
          node --import ./scripts/source-loader.mjs --test plugins/benchgo/test/package-layout.test.mjs
          node --test scripts/desktop/plugin-bundle.test.mjs
      - name: Create complete plugin archive
        run: node scripts/desktop/package-plugin-update.mjs --out artifacts/plugins
      - name: Bind completed verification to immutable source
        run: node scripts/release/record-artifact.mjs --component plugin --directory artifacts/plugins --source-sha "$SOURCE_SHA" --release-version "$RELEASE_VERSION" --verified update-feed,plugin-entry-closure,production-dependency-closure
      - uses: actions/upload-artifact@v4
        with:
          name: benchgo-plugin-update
          overwrite: true
          path: artifacts/plugins/*
          if-no-files-found: error
          retention-days: 14
