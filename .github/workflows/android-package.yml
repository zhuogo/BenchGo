name: BenchGo Android package
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      release_version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            plugins/link/package-lock.json
            plugins/benchgo/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Stage unified identity without changing component versions
        run: node scripts/release/stage.mjs --source-sha "$SOURCE_SHA" --release-version "$RELEASE_VERSION"
      - name: Prepare official package manager
        run: |
          npm install --global --force corepack@0.34.0
          corepack enable
      - name: Install official, plugin and server seed dependencies
        run: |
          npm run setup
          npm ci --prefix plugins/link
          npm ci --prefix plugins/benchgo
      - name: Build and verify signed Android release
        env:
          BENCHGO_ANDROID_KEYSTORE_BASE64: ${{ secrets.BENCHGO_ANDROID_KEYSTORE_BASE64 }}
          BENCHGO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BENCHGO_ANDROID_KEYSTORE_PASSWORD }}
          BENCHGO_ANDROID_KEY_ALIAS: ${{ secrets.BENCHGO_ANDROID_KEY_ALIAS }}
          BENCHGO_ANDROID_KEY_PASSWORD: ${{ secrets.BENCHGO_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BENCHGO_ANDROID_KEYSTORE_BASE64"
          export BENCHGO_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/benchgo-android-release.jks"
          trap 'rm -f "$BENCHGO_ANDROID_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$BENCHGO_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$BENCHGO_ANDROID_KEYSTORE_PATH"
          npm run build:android -- --release --no-daemon
          version=$(node --input-type=module -e "import { currentVersions } from './scripts/release/plan.mjs'; console.log((await currentVersions()).android)")
          apk="benchgo-$version-android.apk"
          cp plugins/link/mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "ANDROID_ARTIFACT=$apk" >> "$GITHUB_ENV"
      - name: Verify native update signatures, versions and download integrity
        working-directory: plugins/link/mobile/android
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Bind completed verification to immutable source
        run: node scripts/release/record-artifact.mjs --component android --directory . --source-sha "$SOURCE_SHA" --release-version "$RELEASE_VERSION" --verified android-release-signature,android-current-resources,android-non-debuggable,android-update-signature-tests
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ANDROID_ARTIFACT }}
          overwrite: true
          path: |
            benchgo-*-android.apk
            benchgo-*-android.apk.sha256
            component-source.json
          if-no-files-found: error
          retention-days: 14
