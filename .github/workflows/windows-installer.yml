name: BenchGo Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchgo-windows-installer
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CI: 'true'
      DSH_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare package manager
        run: |
          # Hosted Windows images include Yarn shims; let Corepack replace them.
          npm install --global --force corepack@0.34.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global core.longpaths true
      - name: Install official locked dependencies
        run: npm run setup
      - name: Build Plus plugin
        run: |
          npm ci --prefix plugins/link
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix plugins/commander
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:plus
          exit $LASTEXITCODE
      - name: Build full Windows installer and verify runtime
        run: npm run package:plus:win
      - name: Verify plugin enrollment and legacy shadow migration
        run: node --test scripts/desktop/plugin-bundle.test.mjs plugins/commander/test/plugin-install.test.mjs
      - name: Download previous installer for in-place upgrade verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tags = @(gh release list --repo $env:GITHUB_REPOSITORY --limit 200 --json tagName --jq '.[].tagName' | Where-Object { $_ -ne "v$version" -and $_ -match '^v\d+\.\d+\.\d+$' })
          if ($tags.Count -eq 0) {
            'No previous application release; skipping in-place upgrade verification.'
          } else {
          $previousTag = @($tags | Sort-Object { [version]($_.Substring(1)) })[-1]
            $previousVersion = $previousTag.Substring(1)
            gh release download $previousTag --repo $env:GITHUB_REPOSITORY --pattern "benchgo-$previousVersion-win-x64-setup.exe" --dir previous
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release download $previousTag --repo $env:GITHUB_REPOSITORY --pattern 'SHA256SUMS.txt' --dir previous
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $previous = Join-Path $PWD "previous/benchgo-$previousVersion-win-x64-setup.exe"
            $expected = Get-Content previous/SHA256SUMS.txt | Where-Object { $_ -match "  benchgo-$previousVersion-win-x64-setup.exe$" }
            if (-not $expected -or ($expected -split '\s+')[0] -ne (Get-FileHash $previous -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'Previous installer checksum mismatch' }
          }
      - name: Verify fresh install, legacy plugin repair and in-place upgrade
        run: |
          $previous = Get-ChildItem previous/*-win-x64-setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($previous) { ./scripts/desktop/test-install-windows.ps1 -PreviousInstaller $previous.FullName }
          else { ./scripts/desktop/test-install-windows.ps1 }
      - name: Record verified artifact source
        run: |
          @'
          import { createHash } from 'node:crypto';
          import { existsSync } from 'node:fs';
          import { readFile, readdir, writeFile } from 'node:fs/promises';
          const directory = 'artifacts/windows';
          const names = (await readdir(directory)).filter(name => /(?:\.exe|\.blockmap|latest\.yml)$/.test(name)).sort();
          const app = JSON.parse(await readFile('package.json'));
          const artifact = `benchgo-${app.version}-win-x64-setup.exe`;
          if (!names.includes(artifact)) throw new Error('Expected BenchGo installer is missing');
          const files = await Promise.all(names.map(async name => {
            const bytes = await readFile(`${directory}/${name}`);
            return { name, size: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') };
          }));
          const verified = ['packaged-runtime', 'fresh-install', 'legacy-plugin-shadow-repair', 'actual-plugin-resolution'];
          if (existsSync('previous')) verified.push('legacy-upgrade');
          await writeFile(`${directory}/build-source.json`, JSON.stringify({ schemaVersion: 1, sourceSha: process.env.GITHUB_SHA, version: app.version, artifact, verified, files }, null, 2) + '\n');
          '@ | node --input-type=module
          exit $LASTEXITCODE
      - name: Retain installer
        if: ${{ always() && hashFiles('artifacts/windows/*-win-x64-setup.exe') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: benchgo-windows-x64
          path: |
            artifacts/windows/*.exe
            artifacts/windows/*.blockmap
            artifacts/windows/latest.yml
            artifacts/windows/build-source.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: benchgo-windows-diagnostics
          include-hidden-files: true
          path: |
            deepseek-harness/apps/desktop/.desktop-build/packaging-runs/
            artifacts/windows/builder-debug.yml
          if-no-files-found: warn
