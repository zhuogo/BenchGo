<script>(()=>{const app=window.App,nav=document.getElementById('benchgo-nav'),button=document.getElementById('benchgo-language');if(String(app?.lang).startsWith('en')){const labels={home:'Home',docs:'Docs',download:'Download'};nav.querySelectorAll('[data-key]').forEach(a=>a.textContent=labels[a.dataset.key]);}const locales=Array.isArray(app?.locales)?app.locales.map(l=>typeof l==='string'?{code:l}:l):[];if(locales.length>1&&app?.setLang){button.hidden=false;const next=locales.find(l=>l.code!==app.lang)||locales[0];button.textContent=next.code.startsWith('en')?'EN':'中文';button.onclick=async()=>{button.disabled=true;try{await app.setLang(next.code);}catch(e){app.showError?.(e.message);}finally{button.disabled=false;}};}const host=document.getElementById('nav-container');if(host)host.dgNavigationCleanup=()=>{button.onclick=null;};})();</script>
